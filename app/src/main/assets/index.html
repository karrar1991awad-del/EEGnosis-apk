<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>EEGnosis Atlas</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="splash">
  <div class="splash-logo">
    <svg viewBox="0 0 100 100" fill="none">
      <path d="M10 50 L25 50 L30 35 L35 65 L40 42 L45 58 L50 30 L55 70 L60 50 L90 50" stroke="#93c5fd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </svg>
  </div>
  <div class="splash-title" id="splashTitle"></div>
  <div class="splash-tagline">MASTER THE WAVES</div>
</div>

<div id="loadingScreen" style="display:none">
  <div class="loading">
    <div class="spinner"></div>
    <p style="color:#9ca3af">جاري التحميل...</p>
  </div>
</div>

<div id="sectionsScreen">
  <div class="sections-header">
    <h1>🧠 EEGnosis Atlas</h1>
    <p id="sectionsInfo">جاري التحميل...</p>
  </div>
  <div class="sections-list" id="sectionsList"></div>
</div>

<div id="viewerScreen">
  <div class="topbar" id="topbar">
    <button class="back-btn" onclick="goBack()">←</button>
    <div class="section-chip">
      <div class="chip-dot" id="chipDot" style="background:#94a3b8"></div>
      <span id="chipText">All</span>
    </div>
    <div class="stats">
      <div class="stat"><div class="stat-dot green"></div><span id="statDone">0</span></div>
      <div class="stat"><div class="stat-dot orange"></div><span id="statWrong">0</span></div>
    </div>
  </div>
  <div class="progress-track" id="progressTrack"><div class="progress-track-fill" id="progressFill"></div></div>
  <div class="viewer" id="viewer">
    <img id="figureImg" src="" alt="">
    <div class="status-dot" id="statusDot"></div>
    <div class="flash" id="flash"></div>
  </div>
  <div class="controls" id="controls">
    <div class="tools-row">
      <button class="tool-btn" id="btnCaption" onclick="toggleCaption()">📖 النص</button>
      <button class="tool-btn" id="btnMark" onclick="toggleMarkings()">🖍️ العلامات</button>
      <button class="tool-btn" onclick="confirmReset()">🔄 إعادة</button>
    </div>
    <div class="action-row">
      <button class="btn-nav" id="prevBtn" onclick="nav(-1)">◀</button>
      <button class="btn-action btn-again" onclick="markAgain()">🔁 مرة أخرى</button>
      <button class="btn-action btn-rec" onclick="markRecognized()">✅ تعرفت عليه</button>
      <button class="btn-nav" id="nextBtn" onclick="nav(1)">▶</button>
    </div>
  </div>
</div>

<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-header">
    <div class="sheet-title">النص التوضيحي</div>
    <button class="sheet-close" onclick="closeCaption()">✕</button>
  </div>
  <div class="sheet-body">
    <div class="sheet-tag" id="sheetTag"></div>
    <div class="sheet-headline" id="sheetHeadline"></div>
    <div class="sheet-details" id="sheetDetails"></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
