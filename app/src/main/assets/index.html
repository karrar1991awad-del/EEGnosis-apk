<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>EEGnosis - Master The Waves</title>
<style>
:root{--bg:#090d16;--bar-bg:#0e131f;--surface:#171f2b;--surface-hi:#242e40;--surface-press:#334057;--sheet-bg:#131a27;--text:#f2f5f8;--text-mid:#dbe0ea;--text-dim:#b3bac7;--green:#16a34a;--orange:#d97706;--accent:#2563eb;--accent-light:#8cb8ff;--neutral:#99a3b3;--font-scale:1}
[data-theme="light"]{--bg:#f1f4f9;--bar-bg:#fcfdfe;--surface:#e6e9f1;--surface-hi:#d9dee7;--sheet-bg:#ffffff;--text:#131a29;--text-mid:#333d52;--text-dim:#616e82;--green:#0d8a3c;--orange:#cc6b05;--accent:#2563eb;--accent-light:#1a52d1}
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;touch-action:manipulation;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body,html{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);transition:background-color .25s,color .25s}
#app-container{display:flex;flex-direction:column;width:100%;height:100%;position:relative}
.top-bar{height:52px;background:var(--bar-bg);display:flex;align-items:center;justify-content:space-between;padding:0 12px;z-index:10;transition:height .2s,opacity .2s}
.progress-bar-container{height:3px;width:100%;background:rgba(255,255,255,.1);position:relative}
.progress-bar-fill{height:100%;width:0%;background:var(--accent-light);transition:width .3s ease}
.main-body{flex:1;display:flex;flex-direction:column;position:relative;overflow:hidden}
@media(min-width:768px) and (orientation:landscape){.main-body{flex-direction:row}.controls-bar{width:120px!important;height:100%!important;flex-direction:column!important;justify-content:center!important}.action-buttons{flex-direction:column!important;width:100%!important}}
.chip{display:flex;align-items:center;gap:8px;background:var(--surface-hi);padding:6px 14px;border-radius:17px;font-size:13px;font-weight:bold;cursor:pointer}
.dot{width:10px;height:10px;border-radius:50%;background:var(--neutral)}
.stats-group{display:flex;gap:6px}
.stat-pill{display:flex;align-items:center;gap:6px;background:var(--surface);padding:4px 10px;border-radius:14px;font-size:12px;color:var(--text-mid)}
.tools-group{display:flex;gap:6px}
.tool-btn{display:flex;align-items:center;gap:6px;background:var(--surface-hi);padding:6px 12px;border-radius:12px;font-size:13px;font-weight:bold;cursor:pointer;color:var(--text);border:none;outline:none}
.tool-btn.active{background:rgba(37,99,235,.28);color:var(--accent-light)}
.tool-btn:disabled{opacity:.35;cursor:not-allowed}
.tool-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.stage{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
#viewport{width:100%;height:100%;position:absolute;top:0;left:0;display:flex;align-items:center;justify-content:center;cursor:grab}
#viewport img{max-width:100%;max-height:100%;object-fit:contain;transform-origin:center center;transition:transform .05s ease-out;pointer-events:none}
.status-dot-indicator{position:absolute;top:14px;left:14px;width:14px;height:14px;border-radius:50%;display:none;z-index:5}
.controls-bar{background:var(--bar-bg);padding:8px 12px;display:flex;flex-direction:column;gap:8px;z-index:10;transition:height .2s,opacity .2s}
.action-buttons{display:flex;gap:10px;width:100%}
.btn{flex:1;height:42px;border-radius:12px;border:none;font-size:14px;font-weight:bold;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:opacity .15s,transform .1s}
.btn:active{transform:scale(.98)}
.btn-again{background:rgba(217,119,6,.16);color:#f59e0b;border:1px solid rgba(217,119,6,.85)}
.btn-rec{background:rgba(22,163,74,.16);color:#22c55e;border:1px solid rgba(22,163,74,.85)}
.btn-nav{width:42px;flex:none;background:var(--surface-hi);color:var(--text)}
.caption-sheet{position:absolute;bottom:0;left:0;width:100%;height:42%;background:var(--sheet-bg);border-radius:18px 18px 0 0;box-shadow:0 -4px 20px rgba(0,0,0,.4);display:flex;flex-direction:column;z-index:20;transform:translateY(100%);transition:transform .25s cubic-bezier(0,0,.2,1)}
.caption-sheet.open{transform:translateY(0)}
.sheet-header{height:36px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;cursor:grab}
.sheet-handle{width:44px;height:4px;background:rgba(255,255,255,.28);border-radius:2px;margin:0 auto}
.sheet-body{flex:1;overflow-y:auto;padding:8px 18px 24px;display:flex;flex-direction:column;gap:12px}
.sheet-tag{font-size:calc(13px * var(--font-scale));font-weight:bold;color:var(--text-dim)}
.sheet-head{font-size:calc(20px * var(--font-scale));font-weight:bold;color:var(--text);line-height:1.25}
.sheet-detail{font-size:calc(16px * var(--font-scale));color:var(--text-mid);line-height:1.45;white-space:pre-wrap}
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-overlay.open{opacity:1;pointer-events:auto}
.modal-card{background:var(--sheet-bg);width:90%;max-width:460px;max-height:85vh;border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px;overflow-y:auto}
.modal-title{font-size:19px;font-weight:bold}
.segmented-control{display:flex;gap:8px;background:var(--surface);padding:4px;border-radius:12px}
.segmented-btn{flex:1;padding:8px;border:none;background:transparent;color:var(--text-mid);border-radius:8px;font-weight:bold;cursor:pointer}
.segmented-btn.active{background:var(--accent);color:#fff}
.full-screen-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:var(--bg);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .4s ease}
#welcome-screen{z-index:150;overflow-y:auto;padding:20px}
.welcome-card{width:100%;max-width:520px;display:flex;flex-direction:column;gap:18px;text-align:center}
.progress-ring-box{background:var(--surface);border-radius:18px;padding:16px;display:flex;align-items:center;gap:16px;text-align:left}
body.focus-mode .top-bar,body.focus-mode .controls-bar,body.focus-mode .progress-bar-container{opacity:0;pointer-events:none;height:0!important;padding:0!important}
#wave-canvas{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;opacity:.4}
.sections-list{padding:16px;overflow-y:auto;flex:1}
.section-card{background:var(--surface);border:1px solid var(--surface-hi);border-radius:12px;padding:16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.section-card.done{border-color:var(--green)}
.section-info{flex:1;text-align:left}
.section-title{font-size:15px;font-weight:bold;display:flex;align-items:center;gap:8px;margin-bottom:6px}
.section-meta{font-size:12px;color:var(--text-dim)}
.dl-btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:10px 18px;font-weight:bold;font-size:13px;cursor:pointer;min-width:90px}
.dl-btn.done{background:var(--green)}
.progress-bar-dl{width:100%;height:4px;background:var(--surface-hi);border-radius:2px;margin-top:8px;overflow:hidden;display:none}
.progress-bar-dl.show{display:block}
.progress-bar-dl-fill{height:100%;background:var(--accent-light);width:0;transition:width .3s}
.progress-text{font-size:11px;color:var(--text-dim);margin-top:4px;text-align:center}
</style>
</head>
<body>

<!-- ====== SECTIONS SCREEN ====== -->
<div class="full-screen-overlay" id="sections-screen" style="display:none">
  <div style="width:100%;max-width:560px;height:100%;display:flex;flex-direction:column">
    <div style="padding:24px;text-align:center;border-bottom:1px solid var(--surface-hi)">
      <h1 style="font-size:22px;font-weight:bold;margin-bottom:6px">🧠 EEGnosis Atlas</h1>
      <p style="font-size:13px;color:var(--text-dim)" id="sections-info">Loading...</p>
    </div>
    <div class="sections-list" id="sections-list"></div>
  </div>
</div>

<div id="app-container">
  <header class="top-bar" id="top-bar">
    <div class="chip" onclick="openSectionsModal()">
      <div class="dot" id="chip-dot"></div>
      <span id="chip-label">All sections</span>
    </div>
    <div class="tools-group">
      <button class="tool-btn" id="btn-cap" onclick="toggleCaption()">
        <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
      </button>
      <button class="tool-btn" id="btn-mark" onclick="toggleMarkings()" disabled>
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
      </button>
      <button class="tool-btn" onclick="openSettingsModal()">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      </button>
    </div>
    <div class="stats-group">
      <div class="stat-pill"><div class="dot" style="background:var(--green)"></div><span id="stat-done">0</span></div>
      <div class="stat-pill"><div class="dot" style="background:var(--orange)"></div><span id="stat-wrong">0</span></div>
    </div>
  </header>

  <div class="progress-bar-container">
    <div class="progress-bar-fill" id="pbar"></div>
  </div>

  <main class="main-body">
    <div class="stage">
      <div id="viewport">
        <div class="status-dot-indicator" id="status-dot"></div>
        <img id="main-image" src="" alt="EEG Figure" />
      </div>
      <div class="caption-sheet" id="caption-sheet">
        <div class="sheet-header" onclick="toggleCaption()"><div class="sheet-handle"></div></div>
        <div class="sheet-body">
          <div class="sheet-tag" id="sheet-tag"></div>
          <div class="sheet-head" id="sheet-head"></div>
          <div class="sheet-detail" id="sheet-detail"></div>
        </div>
      </div>
    </div>
    <footer class="controls-bar" id="controls-bar">
      <div class="action-buttons">
        <button class="btn btn-nav" onclick="navigate(-1)">&#10094;</button>
        <button class="btn btn-again" onclick="markStatus('again')">Again</button>
        <button class="btn btn-rec" onclick="markStatus('rec')">Recognized</button>
        <button class="btn btn-nav" onclick="navigate(1)">&#10095;</button>
      </div>
    </footer>
  </main>
</div>

<div class="full-screen-overlay" id="splash-screen" onclick="dismissSplash()">
  <svg width="120" height="120" viewBox="0 0 100 100">
    <rect width="100" height="100" rx="24" fill="#131a27"/>
    <path d="M 10 50 Q 25 30, 40 50 T 70 50 T 90 50" fill="none" stroke="#2563eb" stroke-width="4"/>
    <path d="M 10 50 Q 30 10, 45 50 T 80 50 T 90 50" fill="none" stroke="#8cb8ff" stroke-width="3"/>
  </svg>
  <h1 style="font-size:36px;margin-top:20px;font-weight:bold">EEGnosis</h1>
  <p style="color:var(--accent-light);margin-top:8px;font-size:16px">Master The Waves</p>
</div>

<div class="full-screen-overlay" id="welcome-screen" style="display:none">
  <canvas id="wave-canvas"></canvas>
  <div class="welcome-card">
    <h2 style="font-size:32px;font-weight:bold">Welcome to the<br>EEG world</h2>
    <p style="color:var(--text-dim)">Train your eye to read the waves, one pattern at a time.</p>
    <div class="progress-ring-box">
      <div style="font-size:22px;font-weight:bold" id="welcome-pct">0%</div>
      <div>
        <div style="font-weight:bold">Your progress</div>
        <div style="font-size:13px;color:var(--text-mid)" id="welcome-stats">0 answered</div>
        <div style="font-size:13px;color:var(--accent-light)" id="welcome-streak">0-day streak</div>
      </div>
    </div>
    <div style="background:var(--surface);border-radius:18px;padding:16px;text-align:left;cursor:pointer" onclick="nextTip()">
      <div style="font-size:11px;font-weight:bold;color:var(--accent-light);margin-bottom:4px">EEG TIP · tap for another</div>
      <div id="tip-text" style="font-size:14px;color:var(--text-mid)">Loading tip...</div>
    </div>
    <button class="btn btn-rec" style="height:50px;font-size:16px" onclick="hideWelcome()">Continue reviewing</button>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal-card" id="modal-card"></div>
</div>

<script>
const START_INDEX = 3;
const END_INDEX = 768;
const MANIFEST_URL = "https://cdn.jsdelivr.net/gh/karrar1991awad-del/eegnosis-apk@main/manifest.json";

const TIPS = [
  "The posterior dominant rhythm (alpha) is 8–13 Hz and attenuates when the eyes open.",
  "Sleep spindles are 11–16 Hz bursts, maximal centrally, and mark stage N2 sleep.",
  "K-complexes and sleep spindles together are the hallmark of stage N2 sleep.",
  "Mu rhythm is an arch-shaped 8–13 Hz rhythm over the central regions that blocks with movement.",
  "Lambda waves are positive occipital sharp transients seen while scanning with eyes open.",
  "Wicket spikes are arch-like 6–11 Hz temporal bursts — a benign variant, not epileptiform.",
  "Eye blinks appear as symmetric frontopolar deflections — the most common artifact you will meet.",
  "Excess frontocentral beta activity is a typical effect of benzodiazepines and barbiturates.",
  "Triphasic waves are frontally predominant with an anterior-to-posterior lag.",
  "Generalized 3 Hz spike-and-wave is the classic pattern of childhood absence epilepsy.",
  "Hypsarrhythmia — chaotic, high-voltage, multifocal spikes — is typical of infantile spasms.",
  "Burst-suppression alternates bursts of activity with marked attenuation.",
  "Lateralized periodic discharges usually point to an acute focal cerebral process.",
  "Before calling anything abnormal, ask: is it cerebral? Rule out artifact."
];

const SECTIONS = [
  ["ALL", "All Sections"],
  ["Normal and Benign Variants", "1. Normal & Benign"],
  ["Artifacts", "2. Artifacts"],
  ["Newborn", "3. Newborn"],
  ["Focal Nonepileptiform Activity", "4. Focal Nonepileptiform"],
  ["Generalized Nonepileptiform Activity", "5. Generalized Nonepileptiform"],
  ["ICU", "6. ICU"],
  ["Epileptic Encephalopathy", "7. Epileptic Encephalopathy"],
  ["Generalized Epilepsy", "8. Generalized Epilepsy"],
  ["Focal Epilepsy", "9. Focal Epilepsy"]
];

let state = {
  theme: 'dark',
  captionSize: 'medium',
  section: 'ALL',
  currentIndex: 0,
  status: {},
  markedOn: false,
  focusMode: false,
  streak: 0,
  lastDay: '',
  tipIndex: 0
};

let allData = [];
let filteredData = [];
let manifest = null;
let sectionsMap = {};

async function init() {
  loadSettings();
  applyTheme(state.theme);
  await loadManifest();
  buildData();
  await loadSectionsMap();
  applyFilter(state.section);
  setupPanZoom();
  setTimeout(() => { dismissSplash(); }, 1800);
}

function loadSettings() {
  const saved = localStorage.getItem('eegnosis_settings');
  if (saved) { try { Object.assign(state, JSON.parse(saved)); } catch(e){} }
  const progress = localStorage.getItem('eegnosis_progress');
  if (progress) {
    try {
      const p = JSON.parse(progress);
      state.status = p.status || {};
      if (p.section) state.section = p.section;
    } catch(e){}
  }
}

function saveSettings() {
  localStorage.setItem('eegnosis_settings', JSON.stringify({
    theme: state.theme,
    captionSize: state.captionSize,
    streak: state.streak,
    lastDay: state.lastDay
  }));
  localStorage.setItem('eegnosis_progress', JSON.stringify({
    status: state.status,
    section: state.section
  }));
}

async function loadManifest() {
  try {
    const res = await fetch(MANIFEST_URL);
    manifest = await res.json();
  } catch(e) { console.error("Manifest failed:", e); }
}

function buildData() {
  allData = [];
  for (let i = START_INDEX; i <= END_INDEX; i++) {
    const num = String(i).padStart(3, '0');
    allData.push({
      id: i,
      image: `${Android.getFiguresDir()}/figure_${num}.jpg`,
      marked: `${Android.getFiguresDir()}/figure_${num}_marked.jpg`,
      txt: `${Android.getFiguresDir()}/figure_${num}.txt`,
      section: 'General'
    });
  }
}

async function loadSectionsMap() {
  try {
    const res = await fetch(`${Android.getFiguresDir()}/sections.json`);
    if (res.ok) {
      sectionsMap = await res.json();
      allData.forEach(d => {
        const key = `figure_${String(d.id).padStart(3, '0')}`;
        if (sectionsMap[key]) d.section = sectionsMap[key];
      });
    }
  } catch(e) {}
}

function applyFilter(code) {
  state.section = code;
  filteredData = code === 'ALL' ? [...allData] : allData.filter(d => d.section === code);
  if (!filteredData.length) filteredData = [...allData];
  state.currentIndex = 0;
  document.getElementById('chip-label').innerText = code === 'ALL' ? 'All sections' : code;
}

function render() {
  if (!filteredData.length) return;
  const item = filteredData[state.currentIndex];
  const btnMark = document.getElementById('btn-mark');
  btnMark.disabled = false;
  btnMark.classList.toggle('active', state.markedOn);
  const imgEl = document.getElementById('main-image');
  imgEl.src = state.markedOn ? item.marked : item.image;
  const st = state.status[item.id];
  const statusDot = document.getElementById('status-dot');
  if (st === 'rec') { statusDot.style.display = 'block'; statusDot.style.background = 'var(--green)'; }
  else if (st === 'again') { statusDot.style.display = 'block'; statusDot.style.background = 'var(--orange)'; }
  else { statusDot.style.display = 'none'; }
  const answered = filteredData.filter(d => state.status[d.id]).length;
  const wrong = filteredData.filter(d => state.status[d.id] === 'again').length;
  document.getElementById('stat-done').innerText = answered;
  document.getElementById('stat-wrong').innerText = wrong;
  document.getElementById('pbar').style.width = `${(answered / filteredData.length) * 100}%`;
  fetchCaption(item.txt);
  resetZoom();
  saveSettings();
}

async function fetchCaption(path) {
  try {
    const res = await fetch(path);
    if (res.ok) parseCaption(await res.text());
    else setCaptionText("", "No caption available", "");
  } catch(e) { setCaptionText("", "No caption available", ""); }
}

function parseCaption(text) {
  const lines = text.trim().split('\n').map(l => l.trim()).filter(Boolean);
  if (!lines.length) return setCaptionText("", "No caption available", "");
  let tag = "", head = lines[0], detail = lines.slice(1).join('\n');
  if (lines[0].toLowerCase().startsWith('fig')) {
    tag = lines[0]; head = lines[1] || ""; detail = lines.slice(2).join('\n');
  }
  setCaptionText(tag, head, detail);
}

function setCaptionText(tag, head, detail) {
  document.getElementById('sheet-tag').innerText = tag;
  document.getElementById('sheet-head').innerText = head;
  document.getElementById('sheet-detail').innerText = detail;
}

function navigate(dir) {
  state.currentIndex = Math.max(0, Math.min(filteredData.length - 1, state.currentIndex + dir));
  state.markedOn = false;
  render();
}

function markStatus(type) {
  const item = filteredData[state.currentIndex];
  state.status[item.id] = type;
  bumpStreak();
  render();
  if (state.currentIndex < filteredData.length - 1) navigate(1);
}

function toggleCaption() {
  const sheet = document.getElementById('caption-sheet');
  const btn = document.getElementById('btn-cap');
  sheet.classList.toggle('open');
  btn.classList.toggle('active', sheet.classList.contains('open'));
}

function toggleMarkings() { state.markedOn = !state.markedOn; render(); }
function applyTheme(theme) { state.theme = theme; document.documentElement.setAttribute('data-theme', theme); }
function setCaptionSize(size) {
  state.captionSize = size;
  document.documentElement.style.setProperty('--font-scale', size === 'small' ? 0.85 : size === 'large' ? 1.2 : 1);
}

let scale = 1, pX = 0, pY = 0, isDragging = false, startX = 0, startY = 0;
function setupPanZoom() {
  const vp = document.getElementById('viewport');
  vp.addEventListener('mousedown', e => { isDragging = true; startX = e.clientX - pX; startY = e.clientY - pY; });
  window.addEventListener('mousemove', e => {
    if (!isDragging || scale === 1) return;
    pX = e.clientX - startX; pY = e.clientY - startY; updateTransform();
  });
  window.addEventListener('mouseup', () => isDragging = false);
  vp.addEventListener('wheel', e => {
    e.preventDefault();
    scale += e.deltaY * -0.002;
    scale = Math.min(Math.max(1, scale), 5);
    if (scale === 1) { pX = 0; pY = 0; }
    updateTransform();
  });
  vp.addEventListener('dblclick', () => {
    state.focusMode = !state.focusMode;
    document.body.classList.toggle('focus-mode', state.focusMode);
  });
}

function resetZoom() { scale = 1; pX = 0; pY = 0; updateTransform(); }
function updateTransform() {
  document.getElementById('main-image').style.transform = `translate(${pX}px, ${pY}px) scale(${scale})`;
}

function openSectionsModal() {
  const card = document.getElementById('modal-card');
  let html = '<div class="modal-title">Select Section</div>';
  if (manifest && manifest.sections) {
    html += manifest.sections.map(s =>
      `<div style="padding:12px;background:var(--surface);border-radius:10px;cursor:pointer" onclick="downloadSection('${s.id}','${s.zip_url}','${s.name}',${s.count})">
        ${s.name} <span style="color:var(--text-dim);font-size:12px">(${s.count} figs, ${s.size_mb}MB)</span>
      </div>`
    ).join('');
  } else {
    html += SECTIONS.map(([code, name]) =>
      `<div style="padding:12px;background:var(--surface);border-radius:10px;cursor:pointer" onclick="selectSection('${code}')">${name}</div>`
    ).join('');
  }
  card.innerHTML = html;
  document.getElementById('modal-overlay').classList.add('open');
}

function selectSection(code) {
  applyFilter(code);
  closeModal();
  render();
}

function downloadSection(id, url, name, count) {
  closeModal();
  if (Android.isSectionDownloaded(id)) { applyFilter(name); render(); return; }
  showToast(`Downloading ${name}...`);
  Android.downloadSection(id, url);
}

function updateProgress(id, pct, status) {
  if (status === "done") {
    showToast(`✅ ${id} downloaded`);
    const sec = manifest.sections.find(s => s.id === id);
    if (sec) applyFilter(sec.full_name);
    render();
  } else if (status.startsWith("error")) {
    showToast(`❌ Failed: ${id}`);
  } else {
    showToast(`Downloading ${id}... ${pct}%`);
  }
}

function showToast(msg) {
  if (Android.showToast) Android.showToast(msg);
}

function openSettingsModal() {
  const card = document.getElementById('modal-card');
  card.innerHTML = `
    <div class="modal-title">Settings</div>
    <div style="font-size:12px;color:var(--text-dim)">APPEARANCE</div>
    <div class="segmented-control">
      <button class="segmented-btn ${state.theme==='dark'?'active':''}" onclick="applyTheme('dark')">Dark</button>
      <button class="segmented-btn ${state.theme==='light'?'active':''}" onclick="applyTheme('light')">Light</button>
    </div>
    <div style="font-size:12px;color:var(--text-dim)">CAPTION SIZE</div>
    <div class="segmented-control">
      <button class="segmented-btn ${state.captionSize==='small'?'active':''}" onclick="setCaptionSize('small')">Small</button>
      <button class="segmented-btn ${state.captionSize==='medium'?'active':''}" onclick="setCaptionSize('medium')">Medium</button>
      <button class="segmented-btn ${state.captionSize==='large'?'active':''}" onclick="setCaptionSize('large')">Large</button>
    </div>
    <button class="btn btn-rec" onclick="showWelcome();closeModal();">Welcome Screen</button>
    <button class="btn btn-again" onclick="resetProgress()">Reset Progress</button>
  `;
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal(e) {
  if (!e || e.target.id === 'modal-overlay') document.getElementById('modal-overlay').classList.remove('open');
}

function dismissSplash() {
  const splash = document.getElementById('splash-screen');
  splash.style.opacity = '0';
  setTimeout(() => splash.style.display = 'none', 400);
  showWelcome();
}

function showWelcome() {
  const w = document.getElementById('welcome-screen');
  w.style.display = 'flex';
  document.getElementById('tip-text').innerText = TIPS[state.tipIndex];
  const answered = Object.keys(state.status).length;
  const pct = Math.round((answered / allData.length) * 100);
  document.getElementById('welcome-pct').innerText = `${pct}%`;
  document.getElementById('welcome-stats').innerText = `${answered} answered`;
  document.getElementById('welcome-streak').innerText = `${state.streak}-day streak`;
}

function hideWelcome() { document.getElementById('welcome-screen').style.display = 'none'; }
function nextTip() {
  state.tipIndex = (state.tipIndex + 1) % TIPS.length;
  document.getElementById('tip-text').innerText = TIPS[state.tipIndex];
}

function bumpStreak() {
  const today = new Date().toISOString().split('T')[0];
  if (state.lastDay !== today) { state.streak += 1; state.lastDay = today; }
}

function resetProgress() {
  if (confirm("Reset all progress?")) {
    state.status = {};
    state.streak = 0;
    saveSettings();
    render();
    closeModal();
  }
}

window.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') navigate(1);
  if (e.key === 'ArrowLeft') navigate(-1);
  if (e.key === 'c') toggleCaption();
});

window.onerror = function(msg, url, line, col, error) {   document.body.innerHTML = '<div style="padding:40px;color:#e5e7eb;background:#090d16;height:100vh;font-family:monospace;overflow:auto"><h1 style="color:#ef4444">EEGnosis Error</h1><p style="color:#fbbf24;margin-top:20px">' + msg + '</p><p style="font-size:12px;color:#9ca3af;margin-top:20px">Line: ' + line + ', Col: ' + col + '</p><pre style="font-size:11px;color:#6b7280;margin-top:20px;white-space:pre-wrap">' + (error && error.stack ? error.stack : 'no stack') + '</pre></div>';   return false; }; window.onload = function() {   try {     init();   } catch(e) {     document.body.innerHTML = '<div style="padding:40px;color:#e5e7eb;background:#090d16;height:100vh;font-family:monospace;overflow:auto"><h1 style="color:#ef4444">Init Error</h1><pre style="font-size:11px;color:#fbbf24;margin-top:20px;white-space:pre-wrap">' + e.toString() + '

' + (e.stack || '') + '</pre></div>';   } };
</script>
</body>
