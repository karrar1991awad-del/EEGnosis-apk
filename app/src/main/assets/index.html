<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#090d16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>EEGnosis</title>
<style>
:root{
  --u:1;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  --bg-rgb:9 13 22; --bar-rgb:14 19 31; --surface-rgb:23 31 43; --surface-hi-rgb:36 46 64;
  --surface-press-rgb:51 64 87; --sheet-rgb:19 26 40;
  --text-rgb:242 245 247; --mid-rgb:219 224 235; --dim-rgb:179 186 199;
  --green-rgb:22 163 74; --orange-rgb:217 119 6; --accent-rgb:37 99 235;
  --accent-light-rgb:140 184 255; --neutral-rgb:153 163 179;
  --bg:rgb(var(--bg-rgb)); --bar:rgb(var(--bar-rgb)); --surface:rgb(var(--surface-rgb));
  --surface-hi:rgb(var(--surface-hi-rgb)); --surface-press:rgb(var(--surface-press-rgb));
  --sheet:rgb(var(--sheet-rgb)); --text:rgb(var(--text-rgb)); --mid:rgb(var(--mid-rgb));
  --dim:rgb(var(--dim-rgb)); --green:rgb(var(--green-rgb)); --orange:rgb(var(--orange-rgb));
  --accent:rgb(var(--accent-rgb)); --accent-light:rgb(var(--accent-light-rgb));
  --neutral:rgb(var(--neutral-rgb));
}
html[data-theme="light"]{
  --bg-rgb:241 244 249; --bar-rgb:253 254 255; --surface-rgb:230 233 241; --surface-hi-rgb:217 223 236;
  --surface-press-rgb:199 209 227; --sheet-rgb:255 255 255;
  --text-rgb:19 26 41; --mid-rgb:51 61 82; --dim-rgb:97 110 130;
  --green-rgb:13 140 61; --orange-rgb:204 107 5; --accent-light-rgb:26 82 209; --neutral-rgb:115 128 148;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:var(--font);overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.sheet-body{-webkit-user-select:text;user-select:text}
button{font-family:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent-light);outline-offset:2px}
img{-webkit-user-drag:none;user-select:none}
#app{position:fixed;inset:0;background:var(--bg);
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#column{position:absolute;inset:0;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#app{padding:0}

/* ---------- top bar ---------- */
#topbar{flex:none;height:calc(52px*var(--u));background:var(--bar);padding:0 calc(12px*var(--u));
  overflow:hidden;transition:height .18s ease-out,opacity .18s ease-out}
#topfloat{position:relative;height:100%}
.chip{position:absolute;left:0;top:50%;transform:translateY(-50%);height:calc(34px*var(--u));
  display:flex;align-items:center;gap:calc(8px*var(--u));padding:0 calc(14px*var(--u)) 0 calc(12px*var(--u));
  background:var(--surface-hi);border-radius:calc(17px*var(--u));font-weight:700;font-size:calc(13px*var(--u));white-space:nowrap}
.dot{flex:none;border-radius:50%;background:var(--neutral)}
.chip .dot{width:calc(10px*var(--u));height:calc(10px*var(--u))}
#stats{position:absolute;right:0;top:50%;transform:translateY(-50%);display:flex;gap:calc(6px*var(--u))}
.stat{height:calc(28px*var(--u));display:flex;align-items:center;gap:calc(6px*var(--u));
  padding:0 calc(12px*var(--u)) 0 calc(10px*var(--u));background:var(--surface);border-radius:calc(14px*var(--u));
  font-size:calc(12px*var(--u));color:var(--mid);white-space:nowrap}
.stat .dot{width:calc(8px*var(--u));height:calc(8px*var(--u))}
#pbar{flex:none;height:3px;background:rgb(var(--text-rgb)/.10);overflow:hidden;transition:height .18s ease-out,opacity .18s ease-out}
#pfill{display:block;height:100%;width:0;background:var(--accent-light);transition:width .25s ease,background .25s}

/* ---------- tools ---------- */
#tools{display:flex;gap:calc(6px*var(--u));width:max-content}
body.land #tools{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.tool{height:calc(34px*var(--u));display:flex;align-items:center;gap:calc(5px*var(--u));
  padding:0 calc(12px*var(--u)) 0 calc(10px*var(--u));background:var(--surface-hi);
  border-radius:calc(12px*var(--u));font-weight:700;font-size:calc(13px*var(--u));white-space:nowrap;flex:none}
.tool:active{background:var(--surface-press)}
.tool.active{background:rgb(var(--accent-rgb)/.28);color:var(--accent-light)}
.tool:disabled{opacity:.4;pointer-events:none}
.tool .g{position:relative;width:calc(18px*var(--u));height:calc(34px*var(--u));flex:none}
.tool .g svg{position:absolute;left:50%;top:50%;width:calc(26px*var(--u));height:calc(26px*var(--u));transform:translate(-50%,-50%);overflow:visible}
.tool.compact{padding:0 calc(8px*var(--u));gap:0}
.tool.compact .lbl{display:none}
.tool.iconly{padding:0 calc(8px*var(--u));gap:0}

/* ---------- body / stage ---------- */
#body{flex:1;min-height:0;display:flex;flex-direction:column}
body.land #body{flex-direction:row}
#stage{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;position:relative}
body.land #stage{flex-direction:row}
#viewer{position:relative;flex:1;min-width:0;min-height:0;overflow:hidden;touch-action:none;cursor:grab}
#viewer img{position:absolute;left:0;top:0;transform-origin:50% 50%;pointer-events:none;
  will-change:transform;max-width:none;display:none}
#vdot{position:absolute;left:12px;top:12px;width:14px;height:14px;border-radius:50%;display:none}
#vflash{position:absolute;inset:2px;border:3px solid transparent;pointer-events:none;opacity:0}
#verr{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;
  color:var(--dim);font-size:14px;white-space:pre-line;opacity:0;pointer-events:none;padding:20px}

/* ---------- caption sheet ---------- */
#sheet{--k:1;background:var(--sheet);display:flex;flex-direction:column;min-height:0;min-width:0;
  border-radius:18px 18px 0 0;overflow:hidden;flex:none}
body:not(.land) #sheet{height:calc(var(--frac,.1)*100%);width:100%}
body.land #sheet{width:calc(var(--frac,.1)*100%);height:100%;border-radius:18px 0 0 18px}
.sheet-head{flex:none;height:calc(40px*var(--u));display:flex}
.sheet-head .lp{flex:none;width:calc(40px*var(--u))}
.handle-zone{flex:1;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab}
.handle-zone i{width:44px;height:4px;border-radius:2px;background:rgb(var(--text-rgb)/.28)}
.iconbtn{position:relative;flex:none;display:block}
.iconbtn svg{position:absolute;left:50%;top:50%;width:calc(28px*var(--u));height:calc(28px*var(--u));
  transform:translate(-50%,-50%);overflow:visible}
.iconbtn::before{content:"";position:absolute;inset:0;margin:auto;width:78%;height:78%;border-radius:50%;background:rgb(var(--text-rgb)/.12);opacity:0}
.iconbtn:active::before{opacity:1}
.iconbtn:disabled{color:rgb(128 135 148/.35);pointer-events:none}
#closeCap{width:calc(40px*var(--u));height:100%}
.sheet-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  padding:2px calc(18px*var(--k)) 24px;display:flex;flex-direction:column;gap:calc(12px*var(--k))}
.c-tag{font-size:calc(13px*var(--k));font-weight:700;color:var(--dim)}
.c-head{font-size:calc(20px*var(--k));font-weight:700;color:var(--text)}
.c-detail{font-size:calc(17px*var(--k));color:var(--mid);line-height:1.25;white-space:pre-wrap}
.c-tag:empty,.c-detail:empty{display:none}

/* ---------- controls ---------- */
#controls{flex:none;background:var(--bar);display:flex;flex-direction:column;overflow:hidden;
  transition:height .18s ease-out,width .18s ease-out,opacity .18s ease-out,padding .18s ease-out}
body:not(.land) #controls{height:calc(94px*var(--u));padding:calc(6px*var(--u)) calc(10px*var(--u));gap:calc(6px*var(--u))}
body.land #controls{width:calc(116px*var(--u));padding:calc(8px*var(--u)) calc(10px*var(--u));justify-content:center}
#toolsRow{display:flex;justify-content:center;height:calc(34px*var(--u));flex:none}
body.land #toolsRow{display:none}
#actions{display:grid;gap:calc(10px*var(--u))}
body:not(.land) #actions{grid-template-columns:calc(42px*var(--u)) 1fr 1fr calc(42px*var(--u));
  grid-template-areas:"prev again rec next";height:calc(42px*var(--u))}
body.land #actions{grid-template-columns:1fr 1fr;grid-template-areas:"rec rec" "again again" "prev next";
  grid-auto-rows:calc(42px*var(--u));column-gap:calc(8px*var(--u))}
#btnPrev{grid-area:prev}#btnNext{grid-area:next}#btnAgain{grid-area:again}#btnRec{grid-area:rec}
#actions .iconbtn{height:100%}
body.focus #topbar,body.focus #pbar{height:0;opacity:0}
body.focus:not(.land) #controls{height:0;opacity:0;padding-top:0;padding-bottom:0}
body.focus.land #controls{width:0;opacity:0;padding-left:0;padding-right:0}

/* ---------- pill buttons ---------- */
.t-orange{--r:217;--g:119;--b:6}
html[data-theme="light"] .t-orange{--r:204;--g:107;--b:5}
.t-green{--r:22;--g:163;--b:74}
html[data-theme="light"] .t-green{--r:13;--g:140;--b:61}
.t-accent{--r:37;--g:99;--b:235}
.t-neutral{--r:140;--g:153;--b:173}
.pill{display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;
  font-size:calc(15px*var(--u));color:#fff;border-radius:calc(16px*var(--u));
  background:rgb(var(--r) var(--g) var(--b));min-width:0}
.pill:active{background:rgb(calc(var(--r)*.75) calc(var(--g)*.75) calc(var(--b)*.75))}
.pill.tint{border-radius:calc(12px*var(--u));background:rgb(var(--r) var(--g) var(--b)/.16);
  box-shadow:inset 0 0 0 1.2px rgb(var(--r) var(--g) var(--b)/.85);
  color:rgb(calc(var(--r)*.45 + 140) calc(var(--g)*.45 + 140) calc(var(--b)*.45 + 140))}
html[data-theme="light"] .pill.tint{color:rgb(calc(var(--r)*.62) calc(var(--g)*.62) calc(var(--b)*.62))}
.pill.tint:active{background:rgb(var(--r) var(--g) var(--b)/.34)}
.pill:disabled{opacity:.4;pointer-events:none}

/* ---------- overlays ---------- */
.overlay{position:absolute;inset:0;background:var(--bg);touch-action:manipulation}
.splash{z-index:30;transition:opacity .45s ease-in-out}
.splash.out{opacity:0;pointer-events:none}
.splash .card{position:absolute;left:0;right:0;top:47%;transform:translateY(-50%);
  display:flex;flex-direction:column;align-items:center}
.logo{display:block;flex:none}
.logo-fade{opacity:0;transition:opacity .8s ease-out}
.logo-fade.on{opacity:1}
.ltrs{display:flex;justify-content:center;white-space:pre}
.ltr{opacity:0;transition:opacity .45s ease-out}
.ltr.on{opacity:1}
.welcome{z-index:20;transition:opacity .35s ease-in-out}
.welcome.out{opacity:0;pointer-events:none}
.welcome canvas.wave{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.w-scroll{position:absolute;inset:0;overflow-y:auto;display:flex;padding:calc(20px*var(--u)) 0;-webkit-overflow-scrolling:touch}
.w-main{margin:auto;display:flex;flex-direction:column;gap:calc(22px*var(--u));flex:none}
.w-main.two{flex-direction:row;align-items:center}
.w-main.two>*{flex:1 1 0;min-width:0}
.blk{display:flex;flex-direction:column}
.fadein{opacity:0;animation:fadeIn .5s ease-out forwards}
@keyframes fadeIn{to{opacity:1}}
.w-title{text-align:center;font-weight:700;color:var(--text);white-space:pre-line;line-height:1.2}
.w-sub{text-align:center;color:var(--dim);line-height:1.25}
.pcard{display:flex;align-items:center;gap:calc(16px*var(--u));height:calc(116px*var(--u));padding:calc(14px*var(--u));
  background:var(--surface);border-radius:calc(18px*var(--u))}
.ring{position:relative;flex:none;width:calc(88px*var(--u));height:calc(88px*var(--u))}
.ring svg{width:100%;height:100%;display:block}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:calc(20px*var(--u))}
.pinfo{display:flex;flex-direction:column;gap:calc(2px*var(--u));min-width:0}
.pinfo .l1{font-weight:700;font-size:calc(15px*var(--u))}
.pinfo .l2{font-size:calc(13px*var(--u));color:var(--mid)}
.pinfo .l3{font-size:calc(13px*var(--u));color:var(--accent-light)}
.pinfo .l3.on{font-weight:700}
.tcard{text-align:left;display:block;width:100%;padding:calc(16px*var(--u));background:var(--surface);
  border-radius:calc(18px*var(--u));margin-top:calc(14px*var(--u))}
.tcard .k{font-size:calc(11px*var(--u));font-weight:700;color:var(--accent-light);margin-bottom:calc(6px*var(--u))}
.tcard .t{font-size:calc(15px*var(--u));color:var(--mid);line-height:1.25;transition:opacity .3s}
.startbtn{width:100%;height:calc(56px*var(--u));font-size:calc(17px*var(--u))}
.wrow{display:flex;justify-content:center;gap:calc(8px*var(--u));margin-top:calc(14px*var(--u))}

/* ---------- modals ---------- */
#modalHost{position:absolute;inset:0;z-index:40;pointer-events:none}
.modal-ov{position:absolute;inset:0;background:rgb(0 0 0/.7);display:flex;align-items:center;justify-content:center;
  pointer-events:auto;opacity:0;transition:opacity .15s}
.modal-ov.in{opacity:1}
.modal-box{background:var(--sheet);border-radius:calc(18px*var(--u));max-height:90%;display:flex;flex-direction:column;
  padding:calc(18px*var(--u));gap:calc(10px*var(--u));overflow:hidden}
.m-title{font-weight:700;font-size:calc(19px*var(--u));text-align:center}
.m-title.left{text-align:left;min-height:calc(30px*var(--u));display:flex;align-items:center}
.m-msg{color:var(--mid);text-align:center;font-size:calc(15px*var(--u));line-height:1.3}
.m-scroll{overflow-y:auto;display:flex;flex-direction:column;gap:calc(10px*var(--u));min-height:0;padding:calc(4px*var(--u)) 0 calc(6px*var(--u))}
.m-cap{font-size:calc(12px*var(--u));font-weight:700;color:var(--dim)}
.m-seg{display:flex;gap:calc(8px*var(--u));height:calc(44px*var(--u));flex:none}
.m-seg .pill{flex:1;font-size:calc(14px*var(--u))}
.m-btn{height:calc(44px*var(--u));font-size:calc(14px*var(--u));flex:none}
.m-row{display:flex;gap:calc(12px*var(--u));height:calc(44px*var(--u));flex:none}
.m-row .pill{flex:1;font-size:calc(14px*var(--u))}
.m-mail{text-align:center;font-weight:700;font-size:calc(15px*var(--u));color:var(--accent-light);word-break:break-all}
.m-status{text-align:center;font-size:calc(12px*var(--u));color:var(--dim);min-height:calc(20px*var(--u))}
.m-about{display:flex;flex-direction:column;align-items:center;gap:calc(8px*var(--u))}
.m-about .nm{font-weight:700;font-size:calc(24px*var(--u))}
.m-about .tg{font-size:calc(15px*var(--u));color:var(--accent-light)}
.m-about .ds{font-size:calc(14px*var(--u));color:var(--mid);text-align:center;line-height:1.3}
.m-about .vr{font-size:calc(12px*var(--u));color:var(--dim)}
.srow{display:flex;align-items:center;gap:calc(10px*var(--u));height:calc(52px*var(--u));padding:0 calc(14px*var(--u));
  background:var(--surface);border-radius:calc(12px*var(--u));flex:none;text-align:left;width:100%}
.srow.act{background:var(--surface-hi)}
.srow .dot{width:calc(10px*var(--u));height:calc(10px*var(--u))}
.srow .nm{flex:1;font-size:calc(14px*var(--u));min-width:0}
.srow.act .nm{font-weight:700}
.srow .ct{flex:none;width:calc(84px*var(--u));text-align:right;font-size:calc(12px*var(--u));color:var(--dim)}
.toast{position:absolute;left:50%;bottom:calc(24px*var(--u));transform:translateX(-50%);z-index:50;
  background:var(--surface-hi);color:var(--text);padding:10px 16px;border-radius:12px;font-size:13px;max-width:90%;text-align:center}
@media (prefers-reduced-motion:reduce){
  .fadein{animation-duration:.01s}
  .logo-fade,.ltr,#pfill{transition:none}
}
</style>
</head>
<body>
<noscript>This app needs JavaScript.</noscript>
<div id="app">
  <div id="column">
    <header id="topbar"><div id="topfloat">
      <button id="chip" class="chip" type="button"><span class="dot" id="chipDot"></span><span id="chipLbl">All sections</span></button>
      <div id="stats">
        <div class="stat"><span class="dot" style="background:var(--green)"></span><span id="statDone">0 answered</span></div>
        <div class="stat"><span class="dot" style="background:var(--orange)"></span><span id="statWrong">0 wrong</span></div>
      </div>
    </div></header>
    <div id="pbar"><i id="pfill"></i></div>
    <div id="body">
      <div id="stage">
        <div id="viewer">
          <img id="vimg" alt="" draggable="false">
          <span id="vdot"></span><div id="vflash"></div><div id="verr"></div>
        </div>
      </div>
      <aside id="controls">
        <div id="toolsRow"></div>
        <div id="actions"></div>
      </aside>
    </div>
  </div>
  <div id="modalHost"></div>
</div>

<script>
'use strict';
/* ==========================================================
   الإعدادات — غيّر هنا فقط
   ========================================================== */
const CONFIG = {
  APP_NAME: "EEGnosis",
  TAGLINE: "Master The Waves",
  APP_VERSION: "1.0",

  // ✏️ زر Contact us يستخدم هذي القيم

  // لو رفعت الصور على GitHub Release ضع الروابط هنا (تقدر تستخدم أكثر من Release،
  // لأن الـ Release الواحد أقصاه 1000 ملف):
  //   { from: 3,   to: 400, base: "https://github.com/USER/REPO/releases/download/v1/" },
  //   { from: 401, to: 768, base: "https://github.com/USER/REPO/releases/download/v2/" },
  IMAGE_RELEASES: [],

const TIPS = [
  "The posterior dominant rhythm (alpha) is 8\u201313 Hz and attenuates when the eyes open.",
  "Sleep spindles are 11\u201316 Hz bursts, maximal centrally, and mark stage N2 sleep.",
  "K-complexes and sleep spindles together are the hallmark of stage N2 sleep.",
  "Mu rhythm is an arch-shaped 8\u201313 Hz rhythm over the central regions that blocks with movement.",
  "Lambda waves are positive occipital sharp transients seen while scanning with eyes open.",
  "Wicket spikes are arch-like 6\u201311 Hz temporal bursts \u2014 a benign variant, not epileptiform.",
  "Eye blinks appear as symmetric frontopolar deflections \u2014 the most common artifact you will meet.",

  "Burst-suppression alternates bursts of activity with marked attenuation: think deep anesthesia or severe encephalopathy.",
  "Lateralized periodic discharges usually point to an acute focal cerebral process.",
  "Before calling anything abnormal, ask: is it cerebral? Rule out artifact, check the field and the reactivity.",
];

const SECTIONS = [
  ["ALL", "All Sections"],
  ["Normal and Benign Variants", "1. Normal & Benign"],
  ["Artifacts", "2. Artifacts"],
  ["Newborn", "3. Newborn"],
  ["Focal Nonepileptiform Activity", "4. Focal Nonepileptiform"],
  ["Generalized Nonepileptiform Activity", "5. Generalized Nonepileptiform"],
  ["ICU", "6. ICU"],
  ["Epileptic Encephalopathy", "7. Epileptic Encephalopathy"],
  ["Generalized Epilepsy", "8. Generalized Epilepsy"],
  ["Focal Epilepsy", "9. Focal Epilepsy"],
];
const SHORT = {
  "ALL": "All sections", "Normal and Benign Variants": "Normal & Benign", "Artifacts": "Artifacts",
  "Newborn": "Newborn", "Focal Nonepileptiform Activity": "Focal Non-epi",
  "Generalized Nonepileptiform Activity": "Gen. Non-epi", "ICU": "ICU",
  "Epileptic Encephalopathy": "Encephalopathy", "Generalized Epilepsy": "Gen. Epilepsy",
  "Focal Epilepsy": "Focal Epilepsy", "General": "General",
};
const SECTION_COLORS = {
  "Normal and Benign Variants": [89, 173, 217], "Artifacts": [166, 148, 224], "Newborn": [230, 148, 184],
  "Focal Nonepileptiform Activity": [77, 184, 173], "Generalized Nonepileptiform Activity": [115, 133, 230],
  "ICU": [230, 199, 89], "Epileptic Encephalopathy": [230, 128, 115],

class WaveBG {
  constructor() {
    this.c = el("canvas", { class: "wave" }); this.t = 0; this.last = 0; this.raf = 0;

    if (!this.reduce) this.raf = requestAnimationFrame(this.loop);
  }
  refreshColor() { this.col = getComputedStyle(document.documentElement).getPropertyValue("--accent-light-rgb").trim().split(/\s+/).join(","); }
  resize() { const d = Math.min(2, devicePixelRatio || 1); this.c.width = this.c.clientWidth * d; this.c.height = this.c.clientHeight * d; this.d = d; }
  loop(now) {
    this.raf = requestAnimationFrame(this.loop);
    if (now - this.last < 1000 / 24) return;
    this.t += Math.min(0.1, (now - this.last) / 1000); this.last = now; this.draw();
  }
  draw() {
    const ctx = this.c.getContext("2d"), w = this.c.clientWidth, h = this.c.clientHeight, d = this.d || 1;
    if (!w || !h) return;
    ctx.setTransform(d, 0, 0, d, 0, 0); ctx.clearRect(0, 0, w, h);
    ctx.lineWidth = 1.6; ctx.lineJoin = "round"; ctx.lineCap = "round";
    [0.16, 0.12, 0.09, 0.06].forEach((a, k) => {
      const base = h * (0.22 + 0.17 * k), amp = h * (0.030 + 0.012 * k), freq = 2 + 0.7 * k, speed = 0.6 + 0.25 * k;
      ctx.strokeStyle = `rgba(${this.col},${a})`; ctx.beginPath();
      for (let i = 0; i <= 60; i++) {
        const fx = i / 60;

        i ? ctx.lineTo(w * fx, h - y) : ctx.moveTo(w * fx, h - y);
      }
      ctx.stroke();
    });
  }
  stop() { cancelAnimationFrame(this.raf); this.ro.disconnect(); }
}

      setTimeout(() => { if (!left) { copy().then(() => { status.textContent = "No mail app found \u2014 email copied instead"; }); } }, 1200);
    };
    box.append(el("div", { class: "m-title" }, "Contact us"),
      el("div", { class: "m-msg" }, "Questions, feedback or ideas? We'd love to hear from you."),
      el("div", { class: "m-mail" }, CONFIG.CONTACT_EMAIL), status,
      el("div", { class: "m-row" }, pill("Copy email", "neutral", "tint", copy), pill("Send email", "accent", "solid", send)));
    if (CONFIG.CONTACT_WEBSITE)
      box.append(pill("Visit website", "neutral", "tint", () => window.open(CONFIG.CONTACT_WEBSITE, "_blank", "noopener"), "m-btn"));
  });
}

function openAbout() {
  openModal(460, (box, view) => {
    box.append(el("div", { class: "m-about" }, makeLogo(72 * S.u),
      el("div", { class: "nm" }, CONFIG.APP_NAME), el("div", { class: "tg" }, CONFIG.TAGLINE),
      el("div", { class: "ds" }, "An interactive EEG atlas for training pattern recognition: review the waves, recognize them, and revisit the ones you miss."),
      el("div", { class: "vr" }, `Version ${CONFIG.APP_VERSION}`)),
      pill("Close", "accent", "solid", () => view.dismiss(), "m-btn"));
  });
}

function confirmReset() {
  openModal(420, (box, view) => {
    box.append(el("div", { class: "m-title" }, "Start over?"),
      el("div", { class: "m-msg" }, "This clears all your answered and wrong marks and takes you back to the first image."),
      el("div", { class: "m-row" }, pill("Cancel", "neutral", "tint", () => view.dismiss()),
        pill("Reset", "orange", "tint", () => { view.dismiss(); resetProgress(); })));
  });
}
function resetProgress() {
  S.status = {}; S.seen.clear(); applyFilter("ALL", null);
  viewer.resetView(); render(); saveNow();
}

function openSections() {
  const counts = {};
  for (const d of S.data) counts[d.section] = (counts[d.section] || 0) + 1;
  const codes = [["ALL", "All Sections"]];
  for (const [code, label] of SECTIONS.slice(1)) if (counts[code]) codes.push([code, label]);
  if (counts.General) codes.push(["General", "General"]);
  openModal(460, (box, view) => {
    const list = el("div", { class: "m-scroll" });
    for (const [code, label] of codes) {
      const done = S.data.filter(d => (code === "ALL" || d.section === code) && d.id in S.status).length;
      const row = el("button", { class: "srow" + (code === S.section ? " act" : ""), type: "button" },
        el("span", { class: "dot", style: `background:${code === "ALL" ? "var(--neutral)" : sectionColor(code)}` }),
        el("span", { class: "nm" }, label), el("span", { class: "ct" }, `${done} answered`));
      row.onclick = () => { view.dismiss(); selectSection(code); };
      list.append(row);
    }
    box.style.padding = "calc(14px*var(--u))";
    box.append(el("div", { class: "m-title left", style: "font-size:calc(16px*var(--u))" }, "Sections"), list);
  });
}
function selectSection(code) {
  const cur = S.filtered.length ? S.filtered[S.index].id : null;
  applyFilter(code, cur); render();
}

/* ==========================================================
   التشغيل
   ========================================================== */
document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    const m = S.modals[S.modals.length - 1];
    if (m) m.dismiss(); else if (S.captionOpen) closeCaption();
    return;
  }
  if (S.modals.length || S.welcome || S.splash) return;
  if (e.key === "ArrowRight") navigate(1);
  else if (e.key === "ArrowLeft") navigate(-1);
});
addEventListener("pagehide", saveNow);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") saveNow(); });
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(checkLayout, 60); });
addEventListener("orientationchange", () => setTimeout(checkLayout, 200));

async function boot() {
  applyTheme(SETTINGS.theme);
  [S.land, S.u] = measure();
  buildMain(); layout();
  await Promise.race([probeIcon(), new Promise(r => setTimeout(r, 500))]);
  S.ready = (async () => {
    const [sections, marked] = await Promise.all([loadJSON(CONFIG.ASSETS_DIR + "sections.json"), loadJSON(CONFIG.ASSETS_DIR + "marked.json")]);
    S.sectionsMap = sections;
    if (Array.isArray(marked)) S.markedSet = new Set(marked.map(Number));
    S.data = buildData();
    const [code, lastId] = loadProgress();
    applyFilter(code, lastId);
    render();
  })();
  buildSplash();
  S.ready.then(() => { if (!S.sectionsMap) console.warn("sections.json not found — all figures are in 'General'."); });
}
boot();
</script>
</body>
